<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>axxtren</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans-serif, system-ui, -apple-system;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

/* FIXED background: less blur, no grey wash */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("a.png") center/cover no-repeat;
  transform: scale(1.02);
  filter: blur(3px); /* was 7px */
  opacity: 1; /* removed washed look */
  z-index: -1;
}

.container {
  width: 420px;
  text-align: center;
}

.name {
  font-size: 44px;
  font-weight: 600;
  margin-bottom: 25px;
}

/* glass */
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  padding: 16px;
}

/* buttons */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  padding: 12px;
  margin: 10px 0;

  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  color: white;
  text-decoration: none;

  transition: 0.18s ease;
}

.btn:hover {
  transform: translateY(-2px) scale(1.02);
  background: rgba(255,255,255,0.14);
}

.btn:active {
  transform: scale(0.97);
}

/* FIXED ICON ALIGNMENT (discord issue) */
.icon {
  width: 22px;              /* bigger */
  height: 22px;
  flex-shrink: 0;
  display: block;
  overflow: visible;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 420px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 12px;
}

.song-title { font-size: 14px; }
.song-artist { font-size: 11px; opacity: 0.6; }

.row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

button {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  border-radius: 10px;
  padding: 7px 10px;
  cursor: pointer;
}

/* SEEK */
input[type="range"] {
  width: 100%;
  cursor: pointer;
}

/* TIME */
.time {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 6px;
}

/* VOLUME FIX (hover bug fixed) */
.volume-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.vol-btn {
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
}

/* FIXED: no more disappearing panel */
.volume-panel {
  position: absolute;
  bottom: 44px;
  left: 50%;
  transform: translateX(-50%);

  width: 150px;
  padding: 10px;

  opacity: 0;
  pointer-events: none;

  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  border-radius: 12px;

  transition: 0.2s ease;
}

/* keep open when hovering BOTH button + panel */
.volume-wrap:hover .volume-panel,
.volume-panel:hover {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

<body>

<div class="container">

  <div class="name">axxtren</div>

  <div class="card">

    <a class="btn" href="https://discord.com/users/1462056813691273295" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M20 4.4c-1.6-1-3.4-1.7-5.3-2.1l-.2.5c-1.9-.3-3.9-.3-5.8 0l-.2-.5C6.6 2.7 4.8 3.4 3.2 4.4 1.2 7.6.7 11.3 1.2 15c2 1.5 4.2 2.6 6.4 3.1l.8-1.2c-1.3-.4-2.4-1-3.5-1.7l.3-.2c2.9 1.3 6.1 1.3 9 0l.3.2c-1.1.7-2.2 1.3-3.5 1.7l.8 1.2c2.2-.5 4.4-1.6 6.4-3.1.5-3.7 0-7.4-2.8-10.6z"/>
      </svg>
      discord
    </a>

    <a class="btn" href="https://t.me/axxxtren" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M9.8 16.2 9.4 21c.6 0 .8-.3 1.1-.6l2.6-2.5 5.3 3.9c1 .6 1.7.3 2-.9l3.6-16.8c.3-1.5-.5-2.1-1.5-1.7L2 9.2c-1.4.6-1.4 1.4-.2 1.7l5.6 1.8 13-8.1c.6-.4 1.1-.2.7.2z"/>
      </svg>
      telegram
    </a>

  </div>
</div>

<div class="player">

  <div class="song-title">Randomly</div>
  <div class="song-artist">LUCKI</div>

  <audio id="audio" src="Randomly.mp3" autoplay loop></audio>

  <div class="row">
    <button id="playBtn" onclick="togglePlay()">▶</button>
    <button onclick="restart()">⟲</button>

    <div class="volume-wrap">
      <div class="vol-btn">🔊</div>
      <div class="volume-panel">
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>
  </div>

  <div class="time" id="time">0:00 / 0:00</div>

  <div class="row">
    <input type="range" id="seek" min="0" value="0">
  </div>

</div>

<script>
const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const time = document.getElementById("time");
const playBtn = document.getElementById("playBtn");

let isSeeking = false;

/* smooth updates without fighting user input */
function loop() {
  if (!isNaN(audio.duration)) {

    if (!isSeeking) {
      seek.max = audio.duration;
      seek.value = audio.currentTime;
    }

    const m = Math.floor(audio.currentTime / 60);
    const s = Math.floor(audio.currentTime % 60).toString().padStart(2,"0");
    const md = Math.floor(audio.duration / 60);
    const sd = Math.floor(audio.duration % 60).toString().padStart(2,"0");

    time.textContent = `${m}:${s} / ${md}:${sd}`;
  }

  requestAnimationFrame(loop);
}
loop();

function togglePlay() {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "⏸";
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
}

function restart() {
  audio.currentTime = 0;
  audio.play();
  playBtn.textContent = "⏸";
}

/* FIX smooth seek */
seek.addEventListener("input", () => {
  isSeeking = true;
  audio.currentTime = seek.value;
});

seek.addEventListener("change", () => {
  isSeeking = false;
});

volume.addEventListener("input", () => {
  audio.volume = volume.value;
});
</script>

</body>
</html>
