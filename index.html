<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>axxtren</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;

      background: radial-gradient(circle at top, #1a2233, #070a10);
      color: white;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 20px;
    }

    /* username */
    .name {
      font-size: 42px;
      font-weight: 600;
      margin-bottom: 25px;
      letter-spacing: 1px;
    }

    /* glass card */
    .card {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border-radius: 18px;
      padding: 18px;
      margin-bottom: 18px;
    }

    /* button style */
    .btn {
      display: block;
      text-decoration: none;
      color: white;

      padding: 12px 14px;
      margin: 10px 0;

      border-radius: 14px;

      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);

      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);

      transition: 0.2s ease;
    }

    .btn:hover {
      transform: scale(1.03);
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }

    /* subtle glow */
    .btn:active {
      transform: scale(0.98);
    }

    /* footer tiny vibe */
    .footer {
      margin-top: 14px;
      font-size: 11px;
      opacity: 0.4;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="name">axxtren</div>

    <div class="card">

      <a class="btn" href="https://discord.com/users/1462056813691273295" target="_blank">
        discord
      </a>

      <a class="btn" href="https://github.com/" target="_blank">
        github
      </a>

      <a class="btn" href="https://instagram.com/" target="_blank">
        instagram
      </a>

      <a class="btn" href="https://t.me/" target="_blank">
        telegram
      </a>

    </div>

    <div class="card">
      <a class="btn" href="#">
        associates (coming soon)
      </a>

      <a class="btn" href="#">
        projects (coming soon)
      </a>
    </div>

    <div class="footer">
      axxtren.xyz
    </div>

  </div>
</body>
</html>
