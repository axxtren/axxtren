<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>axxtren</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans-serif, system-ui, -apple-system;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

/* FIXED background: less blur, no grey wash */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("a.png") center/cover no-repeat;
  transform: scale(1.02);
  filter: blur(3px); /* was 7px */
  opacity: 1; /* removed washed look */
  z-index: -1;
}

.container {
  width: 420px;
  text-align: center;
}

.name {
  font-size: 44px;
  font-weight: 600;
  margin-bottom: 25px;
}

/* glass */
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  padding: 16px;
}

/* buttons */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  padding: 12px;
  margin: 10px 0;

  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  color: white;
  text-decoration: none;

  transition: 0.18s ease;
}

.btn:hover {
  transform: translateY(-2px) scale(1.02);
  background: rgba(255,255,255,0.14);
}

.btn:active {
  transform: scale(0.97);
}

/* FIXED ICON ALIGNMENT (discord issue) */
.icon {
  width: 22px;              /* bigger */
  height: 22px;
  flex-shrink: 0;
  display: block;
  overflow: visible;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 420px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 12px;
}

.song-title { 
  font-size: 14px; 
  font-weight: bold; /* Made song name bold */
}
.song-artist { font-size: 11px; opacity: 0.6; }

.row {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

/* Left-aligned controls row */
.controls-left {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

button {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  border-radius: 10px;
  padding: 7px 10px;
  cursor: pointer;
}

/* SEEK */
input[type="range"] {
  width: 100%;
  cursor: pointer;
  -webkit-appearance: none;
  appearance: none;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  outline: none;
}

input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  appearance: none;
  width: 12px;
  height: 12px;
  background: white;
  border-radius: 50%;
  cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
  width: 12px;
  height: 12px;
  background: white;
  border-radius: 50%;
  cursor: pointer;
  border: none;
}

/* TIME */
.time {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 6px;
}

/* VOLUME FIX (hover bug fixed) */
.volume-wrap {
  position: relative;
  display: flex;
  align-items: center;
}

.vol-btn {
  width: 34px;
  height: 34px;
  display: flex;
  align-items: center;
  justify-content: center;

  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  cursor: pointer;
}

/* FIXED: no more disappearing panel */
.volume-panel {
  position: absolute;
  bottom: 44px;
  left: 50%;
  transform: translateX(-50%);

  width: 150px;
  padding: 10px;

  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s ease, visibility 0.2s ease;
  visibility: hidden;

  background: rgba(0,0,0,0.5);
  backdrop-filter: blur(12px);
  border-radius: 12px;
}

/* keep open when hovering BOTH button + panel */
.volume-wrap:hover .volume-panel {
  opacity: 1;
  pointer-events: auto;
  visibility: visible;
}

.volume-panel:hover {
  opacity: 1;
  pointer-events: auto;
  visibility: visible;
}

/* Volume percentage display */
.vol-percentage {
  text-align: center;
  font-size: 11px;
  margin-top: 5px;
  opacity: 0.8;
}
</style>
</head>

  <div class="name">axxtren</div>
