<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>axxtren</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow: hidden;
}

/* BACKGROUND (clean blur, no grey wash) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("a.png") center/cover no-repeat;
  transform: scale(1.08);
  filter: blur(14px);
  opacity: 0.85;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at top, rgba(0,0,0,0.25), rgba(0,0,0,0.6));
  z-index: -1;
}

/* MAIN */
.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 20px;
}

.name {
  font-size: 44px;
  font-weight: 600;
  margin-bottom: 25px;
  letter-spacing: 1px;
  text-shadow: 0 0 6px rgba(255,255,255,0.2);
}

/* GLASS CARD */
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
}

/* BUTTONS */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  text-decoration: none;
  color: white;

  padding: 12px;
  margin: 10px 0;

  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  transition: 0.2s;
  cursor: pointer;
}

.btn:hover {
  transform: scale(1.03);
  background: rgba(255,255,255,0.14);
}

.icon {
  width: 18px;
  height: 18px;
  fill: white;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 420px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 12px;
}

/* SONG INFO */
.song-title {
  font-size: 14px;
  font-weight: 500;
}

.song-artist {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 2px;
}

/* ROWS */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  justify-content: center;
}

/* CONTROLS */
button {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
}

button:hover {
  background: rgba(255,255,255,0.15);
}

input[type="range"] {
  width: 100%;
  cursor: pointer;
}

/* TIME */
.time {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 6px;
}

/* VOLUME */
.volume-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  margin-top: 8px;
}

.vol-icon {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
}

.volume-slider {
  position: absolute;
  bottom: 45px;
  width: 140px;

  opacity: 0;
  pointer-events: none;
  transition: 0.2s ease;

  background: rgba(0,0,0,0.45);
  padding: 10px;
  border-radius: 12px;
  backdrop-filter: blur(12px);
}

.volume-wrap:hover .volume-slider {
  opacity: 1;
  pointer-events: auto;
}

.vol-percent {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 4px;
  text-align: center;
}
</style>
</head>

<body>

<div class="container">

  <div class="name">axxtren</div>

  <div class="card">

    <!-- discord -->
    <a class="btn" href="https://discord.com/users/1462056813691273295" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M20 4.4a16 16 0 0 0-4-1.3l-.2.4a15 15 0 0 1 3.5 1.7 12 12 0 0 0-10.6 0 15 15 0 0 1 3.5-1.7l-.2-.4a16 16 0 0 0-4 1.3C3.5 8 2.8 11.5 3 15c2 1.5 4 2.4 6 3 0 0 .5-.6.9-1.1a12 12 0 0 1-1.7-.8l.3-.2c3.3 1.5 6.9 1.5 10.2 0l.3.2a12 12 0 0 1-1.7.8c.4.5.9 1.1.9 1.1 2-.6 4-1.5 6-3 .2-3.5-.5-7-3-10.6z"/>
      </svg>
      discord
    </a>

    <!-- telegram -->
    <a class="btn" href="https://t.me/axxxtren" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M9.8 16.6 9.4 21c.6 0 .8-.3 1.1-.6l2.6-2.5 5.3 3.9c1 .6 1.7.3 2-.9l3.6-16.8c.3-1.5-.5-2.1-1.5-1.7L2 9.2c-1.4.6-1.4 1.4-.2 1.7l5.6 1.8 13-8.1c.6-.4 1.1-.2.7.2z"/>
      </svg>
      telegram
    </a>

  </div>
</div>

<!-- PLAYER -->
<div class="player">

  <div class="song-title">Randomly</div>
  <div class="song-artist">LUCKI</div>

  <audio id="audio" src="Randomly.mp3" autoplay loop></audio>

  <div class="row">
    <button id="playBtn" onclick="togglePlay()">▶</button>
    <button onclick="restart()">⟲</button>
  </div>

  <div class="time" id="time">0:00 / 0:00</div>

  <div class="row">
    <input type="range" id="seek" min="0" value="0">
  </div>

  <div class="volume-wrap">

    <button class="vol-icon">🔊</button>

    <div class="volume-slider">
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
      <div class="vol-percent" id="volPercent">50%</div>
    </div>

  </div>

</div>

<script>
const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const time = document.getElementById("time");
const playBtn = document.getElementById("playBtn");
const volPercent = document.getElementById("volPercent");

function togglePlay() {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "⏸";
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
}

function restart() {
  audio.currentTime = 0;
  audio.play();
  playBtn.textContent = "⏸";
}

audio.addEventListener("loadedmetadata", () => {
  seek.max = audio.duration;
  updateTime();
  playBtn.textContent = audio.paused ? "▶" : "⏸";
});

audio.addEventListener("timeupdate", () => {
  seek.value = audio.currentTime;
  updateTime();
});

function updateTime() {
  const cur = format(audio.currentTime);
  const dur = format(audio.duration);
  time.textContent = `${cur} / ${dur}`;
}

seek.addEventListener("input", () => {
  audio.currentTime = seek.value;
});

volume.addEventListener("input", () => {
  audio.volume = volume.value;
  volPercent.textContent = Math.round(volume.value * 100) + "%";
});

function format(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, "0");
  return `${m}:${sec}`;
}
</script>

</body>
</html>
