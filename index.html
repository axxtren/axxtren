<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>axxtren</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow: hidden;
  cursor: default;
}

/* background (38% blur vibe) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("a.png") center/cover no-repeat;
  transform: scale(1.1);
  filter: blur(10px); /* ~38% vibe (less aggressive than before) */
  opacity: 0.6;
  z-index: -2;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  z-index: -1;
}

.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 20px;
}

.name {
  font-size: 44px;
  font-weight: 600;
  margin-bottom: 25px;
  letter-spacing: 1px;
  text-shadow: 0 0 6px rgba(255,255,255,0.22);
}

/* cards */
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
}

/* buttons */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  text-decoration: none;
  color: white;

  padding: 12px;
  margin: 10px 0;

  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  transition: 0.2s;
  cursor: pointer;
}

.btn:hover {
  transform: scale(1.03);
  background: rgba(255,255,255,0.14);
}

/* icons */
.icon {
  width: 18px;
  height: 18px;
  fill: white;
  opacity: 0.9;
}

/* MUSIC PLAYER */
.player {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 420px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 12px;
}

/* song text */
.song-title {
  font-size: 14px;
  font-weight: 500;
}

.song-artist {
  font-size: 11px;
  opacity: 0.6;
  margin-top: 2px;
}

/* controls row */
.row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

/* buttons */
button {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
}

button:hover {
  background: rgba(255,255,255,0.15);
}

/* sliders = pointer hand vibe */
input[type="range"] {
  width: 100%;
  cursor: pointer;
}

/* time */
.time {
  font-size: 11px;
  opacity: 0.7;
}

/* volume hover reveal */
.volume-wrap {
  position: relative;
}

.volume-slider {
  position: absolute;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;

  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;

  background: rgba(0,0,0,0.4);
  padding: 8px;
  border-radius: 10px;
  backdrop-filter: blur(10px);
}

.volume-wrap:hover .volume-slider {
  opacity: 1;
  pointer-events: auto;
}
</style>
</head>

<body>

<div class="container">
  <div class="name">axxtren</div>

  <div class="card">

    <!-- discord -->
    <a class="btn" href="https://discord.com/users/1462056813691273295" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M20 4s-2-2-8-2-8 2-8 2-2 8 0 16c6 4 10 4 16 0 2-8 0-16 0-16z"/>
      </svg>
      discord
    </a>

    <!-- telegram -->
    <a class="btn" href="https://t.me/axxxtren" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M9 16l-.5 5 2.5-2 3 2 5-14L3 10l6 2 12-8z"/>
      </svg>
      telegram
    </a>

  </div>
</div>

<!-- MUSIC -->
<div class="player">

  <div class="song-title">Randomly</div>
  <div class="song-artist">LUCKI</div>

  <audio id="audio" src="Randomly.mp3" autoplay loop></audio>

  <div class="row">
    <button onclick="togglePlay()">play / pause</button>
    <button onclick="restart()">⟲</button>
  </div>

  <div class="row">
    <input type="range" id="seek" min="0" value="0">
  </div>

  <div class="row volume-wrap">
    <div style="font-size:12px;opacity:0.7;">vol</div>

    <div class="volume-slider">
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
    </div>
  </div>

  <div class="time" id="time">0:00 / 0:00</div>
</div>

<script>
const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const time = document.getElementById("time");

function togglePlay() {
  if (audio.paused) audio.play();
  else audio.pause();
}

function restart() {
  audio.currentTime = 0;
  audio.play();
}

/* show time immediately when metadata loads */
audio.addEventListener("loadedmetadata", () => {
  seek.max = audio.duration;
  updateTime();
});

/* live update */
audio.addEventListener("timeupdate", () => {
  seek.value = audio.currentTime;
  updateTime();
});

function updateTime() {
  const cur = format(audio.currentTime);
  const dur = format(audio.duration);
  time.textContent = `${cur} / ${dur}`;
}

seek.addEventListener("input", () => {
  audio.currentTime = seek.value;
});

volume.addEventListener("input", () => {
  audio.volume = volume.value;
});

function format(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, "0");
  return `${m}:${sec}`;
}

/* force initial UI update */
setTimeout(() => {
  if (!isNaN(audio.duration)) {
    seek.max = audio.duration;
    updateTime();
  }
}, 500);
</script>

</body>
</html>
