<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>axxtren</title>

<style>
:root {
  --white: rgba(255, 255, 255, 0.96);
  --soft: rgba(255, 255, 255, 0.66);
  --faint: rgba(255, 255, 255, 0.2);
  --glass: rgba(255, 255, 255, 0.105);
  --glass-strong: rgba(255, 255, 255, 0.18);
  --shadow: rgba(0, 0, 0, 0.36);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

html,
body {
  height: 100%;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--white);
  background: #050507;
}

body::before {
  content: "";
  position: fixed;
  inset: -18px;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.08), transparent 34%, rgba(0,0,0,0.34)),
    url("a.png") center/cover no-repeat;
  filter: blur(2px) saturate(1.18) contrast(1.08);
  transform: scale(1.035);
  z-index: -3;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 42%, transparent 0 18%, rgba(0,0,0,0.12) 43%, rgba(0,0,0,0.58) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.42));
  z-index: -2;
}

.page {
  width: min(440px, calc(100vw - 32px));
  display: grid;
  justify-items: center;
  gap: 24px;
  transform: translateY(-34px);
}

.identity {
  position: relative;
  text-align: center;
  padding: 20px 28px 18px;
}

.identity::before {
  content: "";
  position: absolute;
  inset: -10px -24px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04) 42%, rgba(255,255,255,0.12)),
    radial-gradient(circle at 32% 15%, rgba(255,255,255,0.22), transparent 38%);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 30px;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.4),
    inset 0 -18px 34px rgba(255,255,255,0.045),
    0 22px 60px var(--shadow);
  backdrop-filter: blur(24px) saturate(1.55);
  -webkit-backdrop-filter: blur(24px) saturate(1.55);
  opacity: 0.78;
  z-index: -1;
}

.name {
  font-size: clamp(50px, 14vw, 76px);
  line-height: 0.92;
  font-weight: 760;
  letter-spacing: 0;
  text-shadow: 0 10px 36px rgba(0,0,0,0.46);
}

.socials {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 26px;
}

.social-link {
  position: relative;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  color: white;
  text-decoration: none;
  filter: drop-shadow(0 12px 18px rgba(0,0,0,0.42));
  transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
}

.social-link::before {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  filter: blur(14px);
  opacity: 0;
  transform: scale(0.78);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.social-link:hover {
  transform: translateY(-4px) scale(1.08);
  filter: drop-shadow(0 18px 24px rgba(0,0,0,0.45));
}

.social-link:hover::before {
  opacity: 1;
  transform: scale(1);
}

.social-link:active {
  transform: translateY(-1px) scale(0.96);
}

.social-icon {
  width: 31px;
  height: 31px;
  display: block;
  fill: currentColor;
}

.player {
  position: fixed;
  left: 50%;
  bottom: 18px;
  width: min(450px, calc(100vw - 26px));
  padding: 14px;
  transform: translateX(-50%);
  overflow: visible;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 24px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.19), rgba(255,255,255,0.06) 42%, rgba(255,255,255,0.13)),
    rgba(255,255,255,0.08);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.46),
    inset 0 -24px 38px rgba(255,255,255,0.045),
    0 26px 70px rgba(0,0,0,0.42);
  backdrop-filter: blur(28px) saturate(1.7);
  -webkit-backdrop-filter: blur(28px) saturate(1.7);
}

.player::before {
  content: "";
  position: absolute;
  inset: 1px;
  pointer-events: none;
  border-radius: 23px;
  background:
    radial-gradient(circle at 18% 0%, rgba(255,255,255,0.38), transparent 28%),
    linear-gradient(115deg, rgba(255,255,255,0.28), transparent 22%, transparent 62%, rgba(255,255,255,0.12));
  mix-blend-mode: screen;
  opacity: 0.52;
}

.track-head {
  position: relative;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 14px;
}

.track-copy {
  min-width: 0;
}

.song-title {
  font-size: 15px;
  line-height: 1.1;
  font-weight: 800;
  text-align: left;
  color: white;
}

.song-artist {
  margin-top: 3px;
  font-size: 11px;
  line-height: 1.2;
  font-weight: 600;
  text-align: left;
  color: rgba(255,255,255,0.58);
}

.controls-row {
  position: relative;
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 15px;
  margin-top: 13px;
}

.control-btn {
  width: 27px;
  height: 27px;
  display: inline-grid;
  place-items: center;
  appearance: none;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255,255,255,0.92);
  cursor: pointer;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.42));
  transition: transform 0.16s ease, color 0.16s ease, opacity 0.16s ease;
}

.control-btn:hover {
  color: white;
  transform: translateY(-2px) scale(1.08);
}

.control-btn:active {
  transform: scale(0.9);
}

.control-icon {
  width: 19px;
  height: 19px;
  display: block;
  fill: currentColor;
}

.time {
  position: absolute;
  top: 15px;
  right: 15px;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  color: rgba(255,255,255,0.58);
}

.seek-row {
  position: relative;
  display: flex;
  align-items: center;
  margin-top: 14px;
}

input[type="range"] {
  width: 100%;
  height: 18px;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0.34));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 8px 20px rgba(0,0,0,0.22);
}

input[type="range"]::-webkit-slider-thumb {
  width: 14px;
  height: 14px;
  margin-top: -5px;
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid rgba(255,255,255,0.62);
  border-radius: 50%;
  background: white;
  box-shadow: 0 4px 16px rgba(0,0,0,0.36);
}

input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: 999px;
  background: rgba(255,255,255,0.56);
}

input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: 1px solid rgba(255,255,255,0.62);
  border-radius: 50%;
  background: white;
  box-shadow: 0 4px 16px rgba(0,0,0,0.36);
}

.volume-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.volume-panel {
  position: absolute;
  left: 50%;
  bottom: 29px;
  width: 176px;
  padding: 13px 12px 10px;
  opacity: 0;
  pointer-events: none;
  transform: translateX(-50%) translateY(5px) scale(0.96);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 18px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.07)),
    rgba(12,12,16,0.46);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.34),
    0 18px 40px rgba(0,0,0,0.36);
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.volume-panel::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -14px;
  height: 14px;
}

.volume-wrap:hover .volume-panel,
.volume-wrap:focus-within .volume-panel {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0) scale(1);
}

.volume-value {
  display: block;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  text-align: center;
  color: rgba(255,255,255,0.74);
}

@media (max-width: 520px) {
  .page {
    transform: translateY(-44px);
    gap: 22px;
  }

  .identity::before {
    inset: -8px -16px;
    border-radius: 26px;
  }

  .socials {
    gap: 22px;
  }

  .player {
    bottom: 12px;
    border-radius: 22px;
  }
}
</style>
</head>

<body>
<main class="page">
  <section class="identity" aria-label="Profile">
    <h1 class="name">axxtren</h1>
  </section>

  <nav class="socials" aria-label="Social links">
    <a class="social-link" href="https://discord.com/users/1462056813691273295" target="_blank" rel="noopener" aria-label="Discord" title="Discord">
      <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.32 4.37A19.8 19.8 0 0 0 15.36 2.8a.07.07 0 0 0-.08.04c-.21.38-.45.88-.62 1.27a18.27 18.27 0 0 0-5.32 0 12.6 12.6 0 0 0-.63-1.27.08.08 0 0 0-.08-.04c-1.73.3-3.4.83-4.96 1.57a.07.07 0 0 0-.03.03C.54 9.05-.32 13.58.1 18.05c0 .02.02.05.04.06a19.9 19.9 0 0 0 6.08 3.07.08.08 0 0 0 .08-.03c.47-.64.88-1.31 1.24-2.02a.08.08 0 0 0-.04-.1 13.1 13.1 0 0 1-1.9-.9.08.08 0 0 1 0-.13l.38-.3a.08.08 0 0 1 .08-.01c3.96 1.8 8.24 1.8 12.15 0a.08.08 0 0 1 .09.01l.38.3a.08.08 0 0 1 0 .13c-.6.35-1.23.65-1.9.9a.08.08 0 0 0-.04.1c.36.7.77 1.38 1.24 2.02a.08.08 0 0 0 .08.03 19.85 19.85 0 0 0 6.08-3.07.08.08 0 0 0 .04-.06c.5-5.18-.84-9.67-3.92-13.65a.06.06 0 0 0-.03-.03ZM8.02 15.33c-1.2 0-2.18-1.1-2.18-2.45s.96-2.45 2.18-2.45c1.23 0 2.2 1.1 2.18 2.45 0 1.35-.96 2.45-2.18 2.45Zm7.98 0c-1.2 0-2.18-1.1-2.18-2.45s.96-2.45 2.18-2.45c1.23 0 2.2 1.1 2.18 2.45 0 1.35-.95 2.45-2.18 2.45Z"/>
      </svg>
    </a>

    <a class="social-link" href="https://t.me/axxxtren" target="_blank" rel="noopener" aria-label="Telegram" title="Telegram">
      <svg class="social-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.5 3.16c.3-.12.62.13.55.45l-3.03 17.96c-.08.45-.58.69-.96.44l-5.5-3.83-2.75 2.65c-.3.3-.81.16-.92-.25l-1.32-4.72-5.36-1.77c-.47-.16-.5-.81-.05-1.02L22.5 3.16Zm-4.24 4.43-8.13 7.23.86 3.07.48-2.35a.8.8 0 0 1 .27-.45l7.04-6.74c.43-.41.04-1.05-.52-.76Z"/>
      </svg>
    </a>
  </nav>
</main>

<aside class="player" aria-label="Music player">
  <div class="track-head">
    <div class="track-copy">
      <div class="song-title">Randomly</div>
      <div class="song-artist">LUCKI</div>
    </div>
    <div class="time" id="time">0:00 / 0:00</div>
  </div>

  <audio id="audio" src="Randomly.mp3" autoplay loop></audio>

  <div class="controls-row">
    <button class="control-btn" id="playBtn" type="button" onclick="togglePlay()" aria-label="Play">
      <svg class="control-icon" id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>

    <button class="control-btn" type="button" onclick="restart()" aria-label="Restart">
      <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5a7 7 0 1 1-6.32 4H3l4-4 4 4H8.1A5 5 0 1 0 12 7V5Z"/>
      </svg>
    </button>

    <div class="volume-wrap">
      <button class="control-btn" type="button" aria-label="Volume">
        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.2-3.87v7.74A4.5 4.5 0 0 0 16.5 12Zm-2.2-8.2v2.08a7 7 0 0 1 0 12.24v2.08a9 9 0 0 0 0-16.4Z"/>
        </svg>
      </button>
      <div class="volume-panel">
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
        <span class="volume-value" id="volumeValue">50%</span>
      </div>
    </div>
  </div>

  <div class="seek-row">
    <input type="range" id="seek" min="0" max="0" step="0.001" value="0" aria-label="Song progress">
  </div>
</aside>

<script>
const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const volumeValue = document.getElementById("volumeValue");
const time = document.getElementById("time");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");

let isSeeking = false;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const paddedSeconds = Math.floor(seconds % 60).toString().padStart(2, "0");
  return `${minutes}:${paddedSeconds}`;
}

function setPlayIcon(isPlaying) {
  playBtn.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
  playIcon.innerHTML = isPlaying
    ? '<path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function updateVolumeLabel() {
  volumeValue.textContent = `${Math.round(Number(volume.value) * 100)}%`;
}

function updatePlayer() {
  if (Number.isFinite(audio.duration)) {
    seek.max = audio.duration;

    if (!isSeeking) {
      seek.value = audio.currentTime;
    }

    time.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
  }

  requestAnimationFrame(updatePlayer);
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

function restart() {
  audio.currentTime = 0;
  audio.play();
}

audio.volume = Number(volume.value);
updateVolumeLabel();
updatePlayer();

audio.addEventListener("play", () => setPlayIcon(true));
audio.addEventListener("pause", () => setPlayIcon(false));

seek.addEventListener("input", () => {
  isSeeking = true;
  audio.currentTime = Number(seek.value);
});

seek.addEventListener("change", () => {
  audio.currentTime = Number(seek.value);
  isSeeking = false;
});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
  updateVolumeLabel();
});
</script>
</body>
</html>
