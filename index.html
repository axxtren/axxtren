<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>axxtren</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

body {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  color: white;
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("a.png") center/cover no-repeat;
  transform: scale(1.02);
  filter: blur(3px);
  opacity: 1;
  z-index: -1;
}

.container {
  width: 420px;
  text-align: center;
}

.name {
  font-size: 44px;
  font-weight: 600;
  margin-bottom: 25px;
}

.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  padding: 16px;
}

.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px;
  margin: 10px 0;
  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  text-decoration: none;
  transition: transform 0.18s ease, background 0.18s ease;
}

.btn:hover {
  transform: translateY(-2px) scale(1.02);
  background: rgba(255,255,255,0.14);
}

.btn:active {
  transform: scale(0.97);
}

.icon {
  width: 22px;
  height: 22px;
  flex-shrink: 0;
  display: block;
  fill: currentColor;
}

.player {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: min(420px, calc(100vw - 28px));
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 12px;
}

.song-title {
  font-size: 14px;
  font-weight: 700;
  text-align: left;
}

.song-artist {
  font-size: 11px;
  opacity: 0.6;
  text-align: left;
  margin-top: 2px;
}

.controls-row {
  display: flex;
  justify-content: flex-start;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
}

.seek-row {
  display: flex;
  align-items: center;
  margin-top: 10px;
}

.control-btn {
  width: 36px;
  height: 36px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  border-radius: 10px;
  cursor: pointer;
  transition: transform 0.18s ease, background 0.18s ease;
}

.control-btn:hover {
  transform: translateY(-1px);
  background: rgba(255,255,255,0.14);
}

.control-btn:active {
  transform: scale(0.96);
}

.control-icon {
  width: 17px;
  height: 17px;
  fill: currentColor;
}

input[type="range"] {
  width: 100%;
  cursor: pointer;
  accent-color: white;
}

.time {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 8px;
  text-align: left;
}

.volume-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.volume-panel {
  position: absolute;
  left: 0;
  bottom: 36px;
  width: 170px;
  padding: 14px 10px 10px;
  opacity: 0;
  pointer-events: none;
  background: rgba(0,0,0,0.58);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  transition: opacity 0.2s ease;
}

.volume-panel::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -12px;
  height: 12px;
}

.volume-wrap:hover .volume-panel,
.volume-wrap:focus-within .volume-panel {
  opacity: 1;
  pointer-events: auto;
}

.volume-value {
  display: block;
  margin-top: 6px;
  font-size: 11px;
  line-height: 1;
  text-align: center;
  color: rgba(255,255,255,0.8);
}
</style>
</head>

<body>

<div class="container">
  <div class="name">axxtren</div>

  <div class="card">
    <a class="btn" href="https://discord.com/users/1462056813691273295" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20.32 4.37A19.8 19.8 0 0 0 15.36 2.8a.07.07 0 0 0-.08.04c-.21.38-.45.88-.62 1.27a18.27 18.27 0 0 0-5.32 0 12.6 12.6 0 0 0-.63-1.27.08.08 0 0 0-.08-.04c-1.73.3-3.4.83-4.96 1.57a.07.07 0 0 0-.03.03C.54 9.05-.32 13.58.1 18.05c0 .02.02.05.04.06a19.9 19.9 0 0 0 6.08 3.07.08.08 0 0 0 .08-.03c.47-.64.88-1.31 1.24-2.02a.08.08 0 0 0-.04-.1 13.1 13.1 0 0 1-1.9-.9.08.08 0 0 1 0-.13l.38-.3a.08.08 0 0 1 .08-.01c3.96 1.8 8.24 1.8 12.15 0a.08.08 0 0 1 .09.01l.38.3a.08.08 0 0 1 0 .13c-.6.35-1.23.65-1.9.9a.08.08 0 0 0-.04.1c.36.7.77 1.38 1.24 2.02a.08.08 0 0 0 .08.03 19.85 19.85 0 0 0 6.08-3.07.08.08 0 0 0 .04-.06c.5-5.18-.84-9.67-3.92-13.65a.06.06 0 0 0-.03-.03ZM8.02 15.33c-1.2 0-2.18-1.1-2.18-2.45s.96-2.45 2.18-2.45c1.23 0 2.2 1.1 2.18 2.45 0 1.35-.96 2.45-2.18 2.45Zm7.98 0c-1.2 0-2.18-1.1-2.18-2.45s.96-2.45 2.18-2.45c1.23 0 2.2 1.1 2.18 2.45 0 1.35-.95 2.45-2.18 2.45Z"/>
      </svg>
      discord
    </a>

    <a class="btn" href="https://t.me/axxxtren" target="_blank" rel="noopener">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M22.5 3.16c.3-.12.62.13.55.45l-3.03 17.96c-.08.45-.58.69-.96.44l-5.5-3.83-2.75 2.65c-.3.3-.81.16-.92-.25l-1.32-4.72-5.36-1.77c-.47-.16-.5-.81-.05-1.02L22.5 3.16Zm-4.24 4.43-8.13 7.23.86 3.07.48-2.35a.8.8 0 0 1 .27-.45l7.04-6.74c.43-.41.04-1.05-.52-.76Z"/>
      </svg>

  </div>
</div>

<div class="player">
  <div class="song-title">Randomly</div>
  <div class="song-artist">LUCKI</div>

  <audio id="audio" src="Randomly.mp3" autoplay loop></audio>

  <div class="controls-row">
    <button class="control-btn" id="playBtn" type="button" onclick="togglePlay()" aria-label="Play">
      <svg class="control-icon" id="playIcon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M8 5v14l11-7z"/>
      </svg>
    </button>

    <button class="control-btn" type="button" onclick="restart()" aria-label="Restart">
      <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 5a7 7 0 1 1-6.32 4H3l4-4 4 4H8.1A5 5 0 1 0 12 7V5Z"/>
      </svg>
    </button>

    <div class="volume-wrap">
      <button class="control-btn" type="button" aria-label="Volume">
        <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9v6h4l5 4V5L8 9H4Zm12.5 3a4.5 4.5 0 0 0-2.2-3.87v7.74A4.5 4.5 0 0 0 16.5 12Zm-2.2-8.2v2.08a7 7 0 0 1 0 12.24v2.08a9 9 0 0 0 0-16.4Z"/>
        </svg>
      </button>
      <div class="volume-panel">
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5" aria-label="Volume">
        <span class="volume-value" id="volumeValue">50%</span>
      </div>
    </div>
  </div>

  <div class="time" id="time">0:00 / 0:00</div>

  <div class="seek-row">
    <input type="range" id="seek" min="0" max="0" step="0.001" value="0" aria-label="Song progress">
  </div>
</div>

<script>
const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const volumeValue = document.getElementById("volumeValue");
const time = document.getElementById("time");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");

let isSeeking = false;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const paddedSeconds = Math.floor(seconds % 60).toString().padStart(2, "0");
  return `${minutes}:${paddedSeconds}`;
}

function setPlayIcon(isPlaying) {
  playBtn.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
  playIcon.innerHTML = isPlaying
    ? '<path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function updateVolumeLabel() {
  volumeValue.textContent = `${Math.round(Number(volume.value) * 100)}%`;
}

function updatePlayer() {
  if (Number.isFinite(audio.duration)) {
    seek.max = audio.duration;

    if (!isSeeking) {
      seek.value = audio.currentTime;
    }

    time.textContent = `${formatTime(audio.currentTime)} / ${formatTime(audio.duration)}`;
  }

  requestAnimationFrame(updatePlayer);
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

function restart() {
  audio.currentTime = 0;
  audio.play();
}

audio.volume = Number(volume.value);
updateVolumeLabel();
updatePlayer();

audio.addEventListener("play", () => setPlayIcon(true));
audio.addEventListener("pause", () => setPlayIcon(false));

seek.addEventListener("input", () => {
  isSeeking = true;
  audio.currentTime = Number(seek.value);
});

seek.addEventListener("change", () => {
  audio.currentTime = Number(seek.value);
  isSeeking = false;
});

volume.addEventListener("input", () => {
  audio.volume = Number(volume.value);
  updateVolumeLabel();
});
</script>

</body>
</html>
