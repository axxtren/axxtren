<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>axxtren</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
      background: #000;
    }

    /* background image blur */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: url("a.png") center/cover no-repeat;
      transform: scale(1.1);
      filter: blur(18px);
      opacity: 0.55;
      z-index: -2;
    }

    /* dark overlay */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: -1;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 20px;
    }

    /* username */
    .name {
      font-size: 44px;
      font-weight: 600;
      margin-bottom: 25px;
      letter-spacing: 1px;
      text-shadow: 0 0 6px rgba(255,255,255,0.25);
    }

    /* glass card */
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 16px;
    }

    /* buttons */
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;

      text-decoration: none;
      color: white;

      padding: 12px;
      margin: 10px 0;

      border-radius: 14px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);

      transition: 0.2s;
    }

    .btn:hover {
      transform: scale(1.03);
      background: rgba(255,255,255,0.14);
    }

    /* icons */
    .icon {
      width: 18px;
      height: 18px;
      fill: white;
      opacity: 0.9;
    }

    /* music player */
    .player {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 420px;

      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(14px);
      border-radius: 16px;
      padding: 12px;
    }

    .row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }

    button:hover {
      background: rgba(255,255,255,0.15);
    }

    input[type="range"] {
      width: 100%;
    }

    .time {
      font-size: 11px;
      opacity: 0.7;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="name">axxtren</div>

  <div class="card">

    <!-- discord -->
    <a class="btn" href="https://discord.com/users/1462056813691273295" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M20 4s-2-2-8-2-8 2-8 2-2 8 0 16c6 4 10 4 16 0 2-8 0-16 0-16zm-5 12s-1-1-3-1-3 1-3 1v-1s1-2 3-2 3 2 3 2v1zm-6-3c0-1 1-2 2-2s2 1 2 2-1 2-2 2-2-1-2-2zm8 0c0-1 1-2 2-2s2 1 2 2-1 2-2 2-2-1-2-2z"/>
      </svg>
      discord
    </a>

    <!-- telegram -->
    <a class="btn" href="https://t.me/axxxtren" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M9.04 15.47l-.39 5.5c.56 0 .81-.24 1.1-.52l2.63-2.52 5.46 4c1 .55 1.7.26 2-.93l3.6-16.9h0c.32-1.5-.54-2.1-1.52-1.7L1.6 9.1c-1.45.57-1.43 1.38-.25 1.75l5.7 1.78 13.2-8.3c.62-.4 1.18-.18.71.22"/>
      </svg>
      telegram
    </a>

  </div>
</div>

<!-- music player -->
<div class="player">

  <audio id="audio" src="Randomly.mp3" autoplay loop></audio>

  <div class="row">
    <button onclick="togglePlay()">play / pause</button>
    <button onclick="restart()">⟲</button>
  </div>

  <div class="row">
    <input type="range" id="seek" value="0" min="0">
  </div>

  <div class="row">
    <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
  </div>

  <div class="time" id="time">0:00 / 0:00</div>
</div>

<script>
const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const time = document.getElementById("time");

function togglePlay() {
  if (audio.paused) audio.play();
  else audio.pause();
}

function restart() {
  audio.currentTime = 0;
  audio.play();
}

audio.addEventListener("loadedmetadata", () => {
  seek.max = audio.duration;
});

audio.addEventListener("timeupdate", () => {
  seek.value = audio.currentTime;

  const cur = format(audio.currentTime);
  const dur = format(audio.duration);
  time.textContent = `${cur} / ${dur}`;
});

seek.addEventListener("input", () => {
  audio.currentTime = seek.value;
});

volume.addEventListener("input", () => {
  audio.volume = volume.value;
});

function format(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2, "0");
  return `${m}:${sec}`;
}
</script>

</body>
</html>
