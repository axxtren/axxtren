<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>axxtren</title>

<style>
:root {
  --white: rgba(255, 255, 255, 0.96);
  --soft: rgba(255, 255, 255, 0.66);
  --faint: rgba(255, 255, 255, 0.2);
  --glass: rgba(255, 255, 255, 0.105);
  --glass-strong: rgba(255, 255, 255, 0.18);
  --shadow: rgba(0, 0, 0, 0.36);
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
}

html,
body {
  height: 100%;
}

body {
  min-height: 100vh;
  display: grid;
  place-items: center;
  overflow: hidden;
  color: var(--white);
  background: #050507;
  opacity: 0;
  animation: pageFadeIn 720ms ease forwards;
}

body::before {
  content: "";
  position: fixed;
  inset: -18px;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.055), transparent 34%, rgba(0,0,0,0.34)),
    url("a.png") center/cover no-repeat;
  filter: blur(2px) saturate(1.18) contrast(1.08);
  transform: scale(1.04);
  z-index: -3;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 50% 42%, transparent 0 18%, rgba(0,0,0,0.12) 43%, rgba(0,0,0,0.58) 100%),
    linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.42));
  z-index: -2;
}

.side-panel {
  position: fixed;
  top: 18px;
  left: 18px;
  width: min(320px, calc(100vw - 36px));
  display: flex;
  flex-direction: column;
  gap: 14px;
  padding: 16px;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 28px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.095), rgba(255,255,255,0.028) 44%, rgba(255,255,255,0.052)),
    rgba(8,8,12,0.25);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.24),
    inset 0 -22px 36px rgba(255,255,255,0.026),
    0 26px 70px rgba(0,0,0,0.38);
  backdrop-filter: blur(26px) saturate(1.42);
  -webkit-backdrop-filter: blur(26px) saturate(1.42);
  z-index: 3;
}

.terminal {
  display: grid;
  gap: 8px;
}

.terminal-main {
  display: grid;
  gap: 8px;
  opacity: 1;
  transition: opacity 0.22s ease;
}

.terminal.booting .terminal-main {
  opacity: 0;
  pointer-events: none;
}

.boot-log {
  display: none;
  gap: 8px;
}

.terminal.booting .boot-log {
  display: grid;
}

.terminal-line {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  font-size: 12px;
  line-height: 1.1;
  font-weight: 700;
  color: rgba(255,255,255,0.52);
}

.boot-line {
  min-height: 14px;
  font-size: 12px;
  line-height: 1.1;
  font-weight: 700;
  color: rgba(255,255,255,0.52);
}

.boot-line.active::after {
  content: "";
  display: inline-block;
  width: 5px;
  height: 10px;
  margin-left: 4px;
  border-radius: 1px;
  background: rgba(255,255,255,0.48);
  animation: cursorBlink 0.75s steps(2, jump-none) infinite;
}

.terminal-line:first-child {
  color: rgba(255,255,255,0.86);
}

.terminal-key {
  color: rgba(255,255,255,0.38);
}

.terminal-value {
  overflow: hidden;
  color: rgba(255,255,255,0.72);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.terminal-state.playing {
  color: rgba(136,255,174,0.82);
  animation: statePulse 1.45s ease-in-out infinite;
}

.terminal-state.paused {
  color: rgba(255,255,255,0.52);
  animation: none;
}

.visualizer {
  height: 134px;
  position: relative;
  padding: 16px 6px 4px;
  filter: drop-shadow(0 0 16px rgba(255,255,255,0.08));
  transition: filter 0.2s ease;
}

.visualizer.playing {
  filter:
    drop-shadow(0 0 12px rgba(255,255,255,0.16))
    drop-shadow(0 0 26px rgba(255,255,255,0.08));
}

.visualizer-canvas {
  width: 100%;
  height: 124px;
  display: block;
}

.command-wrap {
  position: relative;
}

.command-line {
  width: 100%;
  height: 36px;
  display: flex;
  align-items: center;
  gap: 8px;
  appearance: none;
  border: 1px solid rgba(255,255,255,0.16);
  border-radius: 10px;
  padding: 0 12px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.075), rgba(255,255,255,0.025)),
    rgba(0,0,0,0.12);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.16),
    0 10px 24px rgba(0,0,0,0.18);
  color: rgba(255,255,255,0.72);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  font-weight: 750;
  text-align: left;
  backdrop-filter: blur(16px) saturate(1.3);
  -webkit-backdrop-filter: blur(16px) saturate(1.3);
}

.command-prefix {
  color: rgba(255,255,255,0.36);
}

.command-caret {
  margin-left: auto;
  color: rgba(255,255,255,0.38);
  transition: transform 0.18s ease;
}

.command-wrap.open .command-caret {
  transform: rotate(180deg);
}

.command-menu {
  position: absolute;
  left: 0;
  right: 0;
  top: 44px;
  display: grid;
  gap: 4px;
  padding: 8px;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 14px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.095), rgba(255,255,255,0.025)),
    rgba(8,8,12,0.48);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.18),
    0 18px 42px rgba(0,0,0,0.32);
  backdrop-filter: blur(22px) saturate(1.35);
  -webkit-backdrop-filter: blur(22px) saturate(1.35);
  opacity: 0;
  pointer-events: none;
  transform: translateY(-8px) scale(0.97);
  transform-origin: top;
  transition: opacity 0.18s ease, transform 0.18s ease;
  z-index: 8;
}

.command-wrap.open .command-menu {
  opacity: 1;
  pointer-events: auto;
  transform: translateY(0) scale(1);
}

.command-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  appearance: none;
  border: 0;
  border-radius: 9px;
  padding: 9px 10px;
  background: transparent;
  color: rgba(255,255,255,0.76);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  font-weight: 750;
  text-align: left;
  transition: background 0.14s ease, color 0.14s ease, transform 0.14s ease;
}

.command-item span:last-child {
  color: rgba(255,255,255,0.34);
  font-size: 10px;
}

.command-item:hover {
  background: rgba(255,255,255,0.09);
  color: white;
  transform: translateX(2px);
}

.status-line {
  position: fixed;
  left: 22px;
  bottom: 20px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  line-height: 1;
  font-weight: 750;
  color: rgba(255,255,255,0.38);
  z-index: 4;
}

.toast {
  position: fixed;
  left: 50%;
  top: var(--toast-top, 50%);
  padding: 9px 13px;
  border: 1px solid rgba(255,255,255,0.13);
  border-radius: 999px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.025)),
    rgba(8,8,12,0.5);
  box-shadow: 0 16px 38px rgba(0,0,0,0.28);
  color: rgba(255,255,255,0.72);
  font-size: 11px;
  line-height: 1;
  font-weight: 800;
  opacity: 0;
  pointer-events: none;
  transform: translateX(-50%) translateY(-6px) scale(0.96);
  transition: opacity 0.18s ease, transform 0.18s ease;
  backdrop-filter: blur(18px) saturate(1.3);
  -webkit-backdrop-filter: blur(18px) saturate(1.3);
  z-index: 20;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0) scale(1);
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #38f26d;
  box-shadow: 0 0 12px rgba(56,242,109,0.65);
  animation: statusBreathe 2.4s ease-in-out infinite;
}

@keyframes pageFadeIn {
  from {
    opacity: 0;
    filter: blur(8px);
  }

  to {
    opacity: 1;
    filter: blur(0);
  }
}

@keyframes statePulse {
  0%,
  100% {
    opacity: 0.62;
    text-shadow: 0 0 0 rgba(136,255,174,0);
  }

  50% {
    opacity: 1;
    text-shadow: 0 0 12px rgba(136,255,174,0.32);
  }
}

@keyframes statusBreathe {
  0%,
  100% {
    transform: scale(0.9);
    box-shadow: 0 0 8px rgba(56,242,109,0.42);
  }

  50% {
    transform: scale(1.15);
    box-shadow: 0 0 16px rgba(56,242,109,0.75);
  }
}

@keyframes cursorBlink {
  50% {
    opacity: 0;
  }
}

.page {
  width: min(500px, calc(100vw - 32px));
  display: grid;
  justify-items: center;
  gap: 20px;
  transform: translateY(-48px);
}

.identity {
  position: relative;
  width: min(390px, 100%);
  text-align: center;
  padding: 24px 34px 22px;
}

.identity::before {
  content: "";
  position: absolute;
  inset: -8px 0;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.115), rgba(255,255,255,0.028) 42%, rgba(255,255,255,0.072)),
    radial-gradient(ellipse at 35% 0%, rgba(255,255,255,0.145), transparent 44%);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 34px;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.28),
    inset 0 -18px 34px rgba(255,255,255,0.045),
    0 22px 60px var(--shadow);
  backdrop-filter: blur(24px) saturate(1.55);
  -webkit-backdrop-filter: blur(24px) saturate(1.55);
  opacity: 0.78;
  z-index: -1;
}

.name {
  position: relative;
  font-size: clamp(36px, 9vw, 52px);
  line-height: 0.92;
  font-weight: 800;
  letter-spacing: 0;
  text-shadow: 0 10px 36px rgba(0,0,0,0.46);
  transition: transform 0.22s ease, text-shadow 0.22s ease;
}

.name::after {
  content: "";
  position: absolute;
  left: 8%;
  right: 8%;
  top: -8px;
  height: 1px;
  border-radius: 999px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.52), transparent);
  opacity: 0;
  transform: scaleX(0.35);
  transition: opacity 0.22s ease, transform 0.22s ease;
}

.name:hover {
  transform: translateY(-2px);
  text-shadow:
    0 1px 1px rgba(255,255,255,0.24),
    0 14px 42px rgba(0,0,0,0.5),
    0 0 24px rgba(255,255,255,0.12);
}

.name:hover::after {
  opacity: 1;
  transform: scaleX(1);
}

.lock-time {
  position: relative;
  display: block;
  margin-top: 14px;
  font-size: clamp(38px, 10vw, 58px);
  line-height: 1;
  font-weight: 240;
  letter-spacing: 0;
  color: transparent;
  background:
    linear-gradient(180deg, rgba(255,255,255,0.86), rgba(255,255,255,0.5) 42%, rgba(255,255,255,0.18)),
    linear-gradient(110deg, transparent 8%, rgba(255,255,255,0.52) 34%, transparent 58%);
  background-clip: text;
  -webkit-background-clip: text;
  font-variant-numeric: tabular-nums;
  text-shadow:
    0 1px 0 rgba(255,255,255,0.2),
    0 8px 18px rgba(255,255,255,0.08),
    0 18px 38px rgba(0,0,0,0.42);
  -webkit-text-stroke: 0.55px rgba(255,255,255,0.16);
}

.lock-time::before {
  content: attr(data-time);
  position: absolute;
  inset: 0;
  color: rgba(255,255,255,0.16);
  filter: blur(7px);
  transform: translateY(6px) scale(1.02);
  z-index: -1;
}

.lock-time::after {
  content: attr(data-time);
  position: absolute;
  inset: 0;
  color: rgba(255,255,255,0.13);
  clip-path: inset(0 0 56% 0);
  transform: translateY(-1px);
  pointer-events: none;
}

.lock-date {
  margin-top: 9px;
  font-size: 12px;
  line-height: 1;
  font-weight: 700;
  color: rgba(255,255,255,0.46);
  text-shadow: 0 8px 22px rgba(0,0,0,0.34);
}

.socials {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
  padding: 11px 22px;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 999px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.085), rgba(255,255,255,0.028)),
    rgba(8,8,12,0.22);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.2),
    0 16px 42px rgba(0,0,0,0.28);
  backdrop-filter: blur(20px) saturate(1.35);
  -webkit-backdrop-filter: blur(20px) saturate(1.35);
}

.social-link {
  position: relative;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  color: white;
  text-decoration: none;
  filter: drop-shadow(0 12px 18px rgba(0,0,0,0.42));
  transition: transform 0.2s ease, filter 0.2s ease, opacity 0.2s ease;
}

.social-link::before {
  content: "";
  position: absolute;
  inset: -10px;
  border-radius: 999px;
  background: rgba(255,255,255,0.12);
  filter: blur(14px);
  opacity: 0;
  transform: scale(0.78);
  transition: opacity 0.2s ease, transform 0.2s ease;
}

.social-link:hover {
  transform: translateY(-4px) scale(1.08);
  filter: drop-shadow(0 18px 24px rgba(0,0,0,0.45));
}

.social-link:hover::before {
  opacity: 1;
  transform: scale(1);
}

.social-link:active {
  transform: translateY(-1px) scale(0.96);
}

.social-icon {
  width: 31px;
  height: 31px;
  display: block;
  fill: currentColor;
}

.player {
  position: fixed;
  left: 50%;
  bottom: 18px;
  width: min(500px, calc(100vw - 24px));
  padding: 14px 15px 13px;
  transform: translateX(-50%);
  overflow: visible;
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 24px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.026) 42%, rgba(255,255,255,0.055)),
    rgba(8,8,12,0.28);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.3),
    inset 0 -24px 38px rgba(255,255,255,0.026),
    0 26px 70px rgba(0,0,0,0.42);
  backdrop-filter: blur(26px) saturate(1.45);
  -webkit-backdrop-filter: blur(26px) saturate(1.45);
}

.player::before {
  content: "";
  position: absolute;
  inset: 1px;
  pointer-events: none;
  border-radius: 23px;
  background:
    radial-gradient(circle at 18% 0%, rgba(255,255,255,0.145), transparent 28%),
    linear-gradient(115deg, rgba(255,255,255,0.105), transparent 22%, transparent 62%, rgba(255,255,255,0.05));
  mix-blend-mode: screen;
  opacity: 0.42;
}

.track-head {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.track-copy {
  min-width: 0;
  flex: 1;
}

.cover {
  position: relative;
  width: 54px;
  height: 54px;
  flex: 0 0 auto;
  overflow: hidden;
  border: 1px solid rgba(255,255,255,0.14);
  border-radius: 16px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.1), rgba(255,255,255,0.03)),
    url("Randomly.jpg") center/cover no-repeat;
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.28),
    0 14px 30px rgba(0,0,0,0.32);
}

.cover::after {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(135deg, rgba(255,255,255,0.22), transparent 34%),
    linear-gradient(to top, rgba(0,0,0,0.34), transparent 55%);
}

.song-title {
  font-size: 16px;
  line-height: 1.15;
  font-weight: 650;
  text-align: left;
  color: rgba(255,255,255,0.9);
  letter-spacing: 0;
}

.song-artist {
  margin-top: 3px;
  font-size: 12px;
  line-height: 1.2;
  font-weight: 600;
  text-align: left;
  color: rgba(255,255,255,0.58);
}

.controls-row {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 24px;
  margin-top: 10px;
  padding: 2px 0;
}

.control-btn {
  width: 42px;
  height: 42px;
  display: inline-grid;
  place-items: center;
  appearance: none;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255,255,255,0.92);
  cursor: pointer;
  filter: drop-shadow(0 6px 10px rgba(0,0,0,0.42));
  transition: transform 0.16s ease, color 0.16s ease, opacity 0.16s ease;
}

.control-btn:hover {
  color: white;
  transform: translateY(-2px) scale(1.08);
}

.control-btn:active {
  transform: scale(0.9);
}

.control-icon {
  width: 28px;
  height: 28px;
  display: block;
  fill: currentColor;
}

.time {
  position: relative;
  top: auto;
  right: auto;
  font-size: 11px;
  font-weight: 600;
  line-height: 1;
  color: rgba(255,255,255,0.58);
  margin-top: 3px;
  text-align: right;
}

.seek-row {
  position: relative;
  display: flex;
  align-items: center;
  margin-top: 3px;
}

input[type="range"] {
  width: 100%;
  height: 18px;
  appearance: none;
  -webkit-appearance: none;
  background: transparent;
  cursor: pointer;
}

input[type="range"]::-webkit-slider-runnable-track {
  height: 4px;
  border-radius: 999px;
  background: linear-gradient(90deg, rgba(255,255,255,0.95), rgba(255,255,255,0.34));
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.16), 0 8px 20px rgba(0,0,0,0.22);
}

input[type="range"]::-webkit-slider-thumb {
  width: 14px;
  height: 14px;
  margin-top: -5px;
  appearance: none;
  -webkit-appearance: none;
  border: 1px solid rgba(255,255,255,0.62);
  border-radius: 50%;
  background: white;
  box-shadow: 0 4px 16px rgba(0,0,0,0.36);
}

input[type="range"]::-moz-range-track {
  height: 4px;
  border-radius: 999px;
  background: rgba(255,255,255,0.56);
}

input[type="range"]::-moz-range-thumb {
  width: 14px;
  height: 14px;
  border: 1px solid rgba(255,255,255,0.62);
  border-radius: 50%;
  background: white;
  box-shadow: 0 4px 16px rgba(0,0,0,0.36);
}

.volume-wrap {
  position: relative;
  display: inline-flex;
  align-items: center;
}

.volume-panel {
  position: absolute;
  left: 50%;
  bottom: 38px;
  width: 176px;
  padding: 13px 12px 10px;
  opacity: 0;
  pointer-events: none;
  transform: translateX(-50%) translateY(5px) scale(0.96);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 18px;
  background:
    linear-gradient(145deg, rgba(255,255,255,0.2), rgba(255,255,255,0.07)),
    rgba(12,12,16,0.46);
  box-shadow:
    inset 0 1px 1px rgba(255,255,255,0.34),
    0 18px 40px rgba(0,0,0,0.36);
  backdrop-filter: blur(24px) saturate(1.6);
  -webkit-backdrop-filter: blur(24px) saturate(1.6);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.volume-panel::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -14px;
  height: 14px;
}

.volume-wrap:hover .volume-panel,
.volume-wrap:focus-within .volume-panel {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0) scale(1);
}

.volume-value {
  display: block;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  text-align: center;
  color: rgba(255,255,255,0.74);
}

@media (max-width: 1120px) {
  .side-panel {
    top: 14px;
    width: 280px;
  }
}

@media (max-width: 840px) {
  .side-panel {
    left: 50%;
    top: auto;
    bottom: 180px;
    width: min(500px, calc(100vw - 24px));
    transform: translateX(-50%);
    border-radius: 22px;
  }

  .visualizer {
    height: 70px;
    padding-top: 10px;
  }

  .visualizer-canvas {
    height: 60px;
  }
}

@media (max-width: 520px) {
  .page {
    transform: translateY(-56px);
    gap: 22px;
  }

  .identity::before {
    inset: -8px 0;
    border-radius: 26px;
  }

  .socials {
    gap: 22px;
  }

  .player {
    bottom: 12px;
    border-radius: 22px;
  }

  .side-panel {
    bottom: 170px;
  }

  .cover {

        </svg>

<script>
const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const volumeValue = document.getElementById("volumeValue");
const time = document.getElementById("time");
const playBtn = document.getElementById("playBtn");
const playIcon = document.getElementById("playIcon");
const terminal = document.getElementById("terminal");
const bootLine = document.getElementById("bootLine");
const terminalVolume = document.getElementById("terminalVolume");
const terminalState = document.getElementById("terminalState");
const lockTime = document.getElementById("lockTime");
const lockDate = document.getElementById("lockDate");
const visualizer = document.getElementById("visualizer");
const visualizerCanvas = document.getElementById("visualizerCanvas");
const visualizerCtx = visualizerCanvas.getContext("2d", { alpha: true });
const visualizerBarCount = 14;
const visualizerGap = 6;
const commandWrap = document.getElementById("commandWrap");
const commandLine = document.getElementById("commandLine");
const commandItems = document.querySelectorAll(".command-item");
const toast = document.getElementById("toast");
const socialLinks = document.querySelectorAll(".social-link[data-copy]");
const socials = document.querySelector(".socials");

let isSeeking = false;
let fadeFrame = null;
const fadeMs = 280;
let audioContext = null;
let analyser = null;
let source = null;
let visualizerData = null;
let idleVisualFrame = 0;
let lastDisplayTime = "";
let toastTimer = null;

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const minutes = Math.floor(seconds / 60);
  const paddedSeconds = Math.floor(seconds % 60).toString().padStart(2, "0");
  return `${minutes}:${paddedSeconds}`;
}

function setPlayIcon(isPlaying) {
  playBtn.setAttribute("aria-label", isPlaying ? "Pause" : "Play");
  terminalState.textContent = isPlaying ? "playing" : "paused";
  terminalState.classList.toggle("playing", isPlaying);
  terminalState.classList.toggle("paused", !isPlaying);
  visualizer.classList.toggle("playing", isPlaying);
  playIcon.innerHTML = isPlaying
    ? '<path d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/>'
    : '<path d="M8 5v14l11-7z"/>';
}

function updateLockTime() {
  const now = new Date();
  const hours = now.getHours().toString().padStart(2, "0");
  const minutes = now.getMinutes().toString().padStart(2, "0");
  const timeText = `${hours}:${minutes}`;
  lockTime.textContent = timeText;
  lockTime.dataset.time = timeText;
  lockDate.textContent = now.toLocaleDateString(undefined, {
    weekday: "long",
    month: "long",
    day: "numeric"
  });
}

function updateVolumeLabel() {
  const label = `${Math.round(Number(volume.value) * 100)}%`;
  volumeValue.textContent = label;
  terminalVolume.textContent = label;
}

function showToast(message) {
  clearTimeout(toastTimer);
  const socialsRect = socials.getBoundingClientRect();
  document.documentElement.style.setProperty("--toast-top", `${socialsRect.bottom + 16}px`);
  toast.textContent = message;
  toast.classList.add("show");

  toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 1300);
}

function copyText(value, label = "link") {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard
      .writeText(value)
      .then(() => showToast(`${label} copied`))
      .catch(() => showToast("copy failed"));
    return;
  }

  showToast("copy unavailable");
}

function targetVolume() {
  return Number(volume.value);
}

function fadeAudio(toVolume, duration = fadeMs, afterFade) {
  cancelAnimationFrame(fadeFrame);

  const fromVolume = audio.volume;
  const startedAt = performance.now();

  function step(now) {
    const progress = Math.min((now - startedAt) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    audio.volume = fromVolume + (toVolume - fromVolume) * eased;

    if (progress < 1) {
      fadeFrame = requestAnimationFrame(step);
      return;
    }

    audio.volume = toVolume;
    fadeFrame = null;

    if (afterFade) {
      afterFade();
    }
  }

  fadeFrame = requestAnimationFrame(step);
}

function updatePlayerDisplay(displaySeconds = audio.currentTime) {
  if (Number.isFinite(audio.duration)) {
    seek.max = audio.duration;

    if (!isSeeking) {
      seek.value = audio.currentTime;
    }

    const displayText = `${formatTime(displaySeconds)} / ${formatTime(audio.duration)}`;
    if (displayText !== lastDisplayTime) {
      time.textContent = displayText;
      lastDisplayTime = displayText;
    }
  }
}

function togglePlay() {
  if (audio.paused) {
    playWithFade();
  } else {
    pauseWithFade();
  }
}

function restart() {
  const restartTrack = () => {
    audio.currentTime = 0;
    playWithFade(320);
  };

  if (audio.paused) {
    restartTrack();
    return;
  }

  fadeAudio(0, 170, restartTrack);
}

function playWithFade(duration = fadeMs) {
  setupVisualizer();
  audio.volume = 0;

  const playAttempt = audio.play();
  if (playAttempt && typeof playAttempt.then === "function") {
    playAttempt
      .then(() => fadeAudio(targetVolume(), duration))
      .catch(() => setPlayIcon(false));
    return;
  }

  fadeAudio(targetVolume(), duration);
}

function pauseWithFade() {
  fadeAudio(0, fadeMs, () => {
    audio.pause();
    audio.volume = targetVolume();
  });
}

audio.volume = targetVolume();
updateLockTime();
updateVolumeLabel();
updatePlayerDisplay(0);
setInterval(updateLockTime, 1000);

audio.addEventListener("play", () => setPlayIcon(true));
audio.addEventListener("pause", () => setPlayIcon(false));
audio.addEventListener("loadedmetadata", () => updatePlayerDisplay(audio.currentTime));
audio.addEventListener("timeupdate", () => {
  if (!isSeeking) {
    updatePlayerDisplay(audio.currentTime);
  }
});

seek.addEventListener("input", () => {
  isSeeking = true;
  updatePlayerDisplay(Number(seek.value));
});

seek.addEventListener("change", () => {
  audio.currentTime = Number(seek.value);
  isSeeking = false;
  updatePlayerDisplay(audio.currentTime);
});

volume.addEventListener("input", () => {
  if (!audio.paused) {
    audio.volume = targetVolume();
  }

  updateVolumeLabel();
});

function runBootSequence() {
  const bootSteps = [
    "loading profile...",
    "syncing audio...",
    "starting visualizer...",
    "status: up"
  ];

  bootSteps.forEach((step, index) => {
    setTimeout(() => {
      bootLine.textContent = step;
    }, index * 420);
  });

  setTimeout(() => {
    terminal.classList.remove("booting");
  }, bootSteps.length * 420 + 180);
}

runBootSequence();

commandLine.addEventListener("click", () => {
  const isOpen = commandWrap.classList.toggle("open");
  commandLine.setAttribute("aria-expanded", isOpen ? "true" : "false");
});

document.addEventListener("click", (event) => {
  if (!commandWrap.contains(event.target)) {
    commandWrap.classList.remove("open");
    commandLine.setAttribute("aria-expanded", "false");
  }
});

commandItems.forEach((item) => {
  item.addEventListener("click", () => {
    const command = item.dataset.command;
    commandWrap.classList.remove("open");
    commandLine.setAttribute("aria-expanded", "false");

    if (command === "discord") {
      window.open("https://discord.com/users/1462056813691273295", "_blank", "noopener");
    }

    if (command === "telegram") {
      window.open("https://t.me/axxxtren", "_blank", "noopener");
    }

    if (command === "music") {
      togglePlay();
    }

    if (command === "restart") {
      restart();
    }

    if (command === "copy") {
      copyText(window.location.href, "site");
    }
  });
});

socialLinks.forEach((link) => {
  link.addEventListener("click", (event) => {
    event.preventDefault();
    copyText(link.dataset.copy, link.dataset.copyLabel);
  });
});

function setupVisualizer() {
  if (audioContext) {
    if (audioContext.state === "suspended") {
      audioContext.resume();
    }
    return;
  }

  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  if (!AudioContextClass) return;

  audioContext = new AudioContextClass();
  analyser = audioContext.createAnalyser();
  analyser.fftSize = 64;
  source = audioContext.createMediaElementSource(audio);
  source.connect(analyser);
  analyser.connect(audioContext.destination);
  visualizerData = new Uint8Array(analyser.frequencyBinCount);
}

function resizeVisualizerCanvas() {
  const width = Math.max(1, Math.round(visualizerCanvas.clientWidth));
  const height = Math.max(1, Math.round(visualizerCanvas.clientHeight));
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  const pixelWidth = Math.round(width * ratio);
  const pixelHeight = Math.round(height * ratio);

  if (visualizerCanvas.width !== pixelWidth || visualizerCanvas.height !== pixelHeight) {
    visualizerCanvas.width = pixelWidth;
    visualizerCanvas.height = pixelHeight;
  }

  visualizerCtx.setTransform(ratio, 0, 0, ratio, 0, 0);
  return { width, height };
}

function roundedRectPath(context, x, y, width, height, radius) {
  const safeRadius = Math.min(radius, width / 2, height / 2);
  context.beginPath();
  context.moveTo(x + safeRadius, y);
  context.lineTo(x + width - safeRadius, y);
  context.quadraticCurveTo(x + width, y, x + width, y + safeRadius);
  context.lineTo(x + width, y + height - safeRadius);
  context.quadraticCurveTo(x + width, y + height, x + width - safeRadius, y + height);
  context.lineTo(x + safeRadius, y + height);
  context.quadraticCurveTo(x, y + height, x, y + height - safeRadius);
  context.lineTo(x, y + safeRadius);
  context.quadraticCurveTo(x, y, x + safeRadius, y);
  context.closePath();
}

function drawVisualizerBar(x, y, width, height, opacity) {
  visualizerCtx.save();
  visualizerCtx.globalAlpha = opacity;
  visualizerCtx.shadowColor = "rgba(0,0,0,0.24)";
  visualizerCtx.shadowBlur = 26;
  visualizerCtx.shadowOffsetY = 10;

  const gradient = visualizerCtx.createLinearGradient(0, y + height, 0, y);
  gradient.addColorStop(0, "rgba(255,255,255,0.13)");
  gradient.addColorStop(1, "rgba(255,255,255,0.64)");

  visualizerCtx.fillStyle = "rgba(255,255,255,0.12)";
  roundedRectPath(visualizerCtx, x, y, width, height, width / 2);
  visualizerCtx.fill();

  visualizerCtx.fillStyle = gradient;
  roundedRectPath(visualizerCtx, x, y, width, height, width / 2);
  visualizerCtx.fill();
  visualizerCtx.restore();
}

function animateVisualizer() {
  const canvasSize = resizeVisualizerCanvas();
  const availableWidth = canvasSize.width;
  const availableHeight = canvasSize.height;
  const barWidth = Math.max(5, (availableWidth - visualizerGap * (visualizerBarCount - 1)) / visualizerBarCount);

  visualizerCtx.clearRect(0, 0, availableWidth, availableHeight);

  if (analyser && visualizerData && !audio.paused) {
    analyser.getByteFrequencyData(visualizerData);

    for (let index = 0; index < visualizerBarCount; index++) {
      const start = Math.floor(index * visualizerData.length * 0.64 / visualizerBarCount);
      const end = Math.max(start + 1, Math.floor((index + 1) * visualizerData.length * 0.64 / visualizerBarCount));
      let total = 0;

      for (let dataIndex = start; dataIndex <= end; dataIndex++) {
        total += visualizerData[dataIndex] || 0;
      }

      const mirroredEnergy = visualizerData[Math.max(0, visualizerData.length - index - 8)] || 0;
      const value = Math.max(total / ((end - start + 1) * 255), mirroredEnergy / 420);
      const height = Math.min(availableHeight, 16 + value * (availableHeight - 16));
      const x = index * (barWidth + visualizerGap);
      const y = availableHeight - height;
      drawVisualizerBar(x, y, barWidth, height, 0.45 + value * 0.5);
    }
  } else {
    idleVisualFrame += 0.035;

    for (let index = 0; index < visualizerBarCount; index++) {
      const wave = Math.sin(idleVisualFrame + index * 0.72);
      const height = Math.min(availableHeight, 18 + (wave + 1) * 13);
      const x = index * (barWidth + visualizerGap);
      const y = availableHeight - height;
      drawVisualizerBar(x, y, barWidth, height, 0.42);
    }
  }

  requestAnimationFrame(animateVisualizer);
}

animateVisualizer();
</script>
