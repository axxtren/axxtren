<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>axxtren</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
  overflow: hidden;
}

/* BACKGROUND (less blur, no grey gradient) */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background: url("a.png") center/cover no-repeat;
  transform: scale(1.05);
  filter: blur(9px); /* reduced ~1/3 */
  opacity: 0.9;
  z-index: -1;
}

/* MAIN */
.container {
  width: 100%;
  max-width: 420px;
  text-align: center;
  padding: 20px;
}

.name {
  font-size: 44px;
  font-weight: 600;
  margin-bottom: 25px;
  text-shadow: 0 0 6px rgba(255,255,255,0.18);
}

/* GLASS */
.card {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 18px;
  padding: 16px;
  margin-bottom: 16px;
}

/* BUTTONS */
.btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  text-decoration: none;
  color: white;

  padding: 12px;
  margin: 10px 0;

  border-radius: 14px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);

  cursor: pointer;

  transition: all 0.25s ease;
}

.btn:hover {
  transform: translateY(-2px) scale(1.02);
  background: rgba(255,255,255,0.14);
}

/* smooth click feel */
.btn:active {
  transform: scale(0.98);
}

/* ICONS */
.icon {
  width: 18px;
  height: 18px;
  fill: white;
  opacity: 0.9;
}

/* PLAYER */
.player {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  width: 90%;
  max-width: 420px;

  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(14px);
  border-radius: 16px;
  padding: 12px;
}

/* SONG INFO */
.song-title {
  font-size: 14px;
}

.song-artist {
  font-size: 11px;
  opacity: 0.6;
}

/* ROWS */
.row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}

/* CONTROLS */
button {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: white;
  border-radius: 10px;
  padding: 7px 10px;
  cursor: pointer;
  transition: all 0.2s ease;
}

button:hover {
  transform: scale(1.05);
  background: rgba(255,255,255,0.14);
}

button:active {
  transform: scale(0.95);
}

/* SLIDERS */
input[type="range"] {
  width: 100%;
  cursor: pointer;
  transition: all 0.2s ease;
}

/* TIME */
.time {
  font-size: 11px;
  opacity: 0.7;
  margin-top: 6px;
  transition: opacity 0.3s ease;
}

/* VOLUME */
.volume-wrap {
  position: relative;
  display: flex;
  justify-content: center;
  margin-top: 10px;
}

/* volume hover zone FIX */
.volume-hover-zone {
  position: absolute;
  bottom: 40px;
  width: 160px;
  padding: 12px;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;
}

.volume-wrap:hover .volume-hover-zone {
  opacity: 1;
  pointer-events: auto;
}

/* volume box */
.volume-box {
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(12px);
  border-radius: 12px;
  padding: 10px;
}

/* smooth slider */
.volume-box input {
  width: 100%;
}

/* icon button */
.vol-icon {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 6px 10px;
  cursor: pointer;
  transition: all 0.2s ease;
}

.vol-icon:hover {
  transform: scale(1.05);
}
</style>
</head>

<body>

<div class="container">

  <div class="name">axxtren</div>

  <div class="card">

    <!-- DISCORD (fixed icon) -->
    <a class="btn" href="https://discord.com/users/1462056813691273295" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M20 4.5c-1.6-1-3.3-1.7-5.1-2.1l-.3.6c-1.8-.3-3.7-.3-5.5 0l-.3-.6C7.1 2.8 5.4 3.5 3.8 4.5 1.3 8 1 11.5 1.3 15c2 1.6 4.1 2.6 6.3 3.2l.8-1.2c-1.2-.4-2.3-1-3.4-1.7l.3-.2c2.8 1.3 5.9 1.3 8.7 0l.3.2c-1 .7-2.2 1.3-3.4 1.7l.8 1.2c2.2-.6 4.3-1.6 6.3-3.2.3-3.5 0-7-2.7-10.5zM8.5 13.5c-.7 0-1.3-.6-1.3-1.3s.6-1.3 1.3-1.3 1.3.6 1.3 1.3-.6 1.3-1.3 1.3zm7 0c-.7 0-1.3-.6-1.3-1.3s.6-1.3 1.3-1.3 1.3.6 1.3 1.3-.6 1.3-1.3 1.3z"/>
      </svg>
      discord
    </a>

    <!-- TELEGRAM -->
    <a class="btn" href="https://t.me/axxxtren" target="_blank">
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M9.9 16.2 9.4 21c.6 0 .8-.3 1.1-.6l2.6-2.5 5.3 3.9c1 .6 1.7.3 2-.9l3.6-16.8c.3-1.5-.5-2.1-1.5-1.7L2 9.2c-1.4.6-1.4 1.4-.2 1.7l5.6 1.8 13-8.1c.6-.4 1.1-.2.7.2z"/>
      </svg>
      telegram
    </a>

  </div>
</div>

<!-- PLAYER -->
<div class="player">

  <div class="song-title">Randomly</div>
  <div class="song-artist">LUCKI</div>

  <audio id="audio" src="Randomly.mp3" autoplay loop></audio>

  <!-- controls row -->
  <div class="row">
    <button id="playBtn" onclick="togglePlay()">▶</button>
    <button onclick="restart()">⟲</button>

    <!-- volume icon -->
    <div class="volume-wrap">
      <button class="vol-icon">🔊</button>

      <div class="volume-hover-zone">
        <div class="volume-box">
          <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
        </div>
      </div>
    </div>

  </div>

  <!-- time -->
  <div class="time" id="time">0:00 / 0:00</div>

  <!-- seek -->
  <div class="row">
    <input type="range" id="seek" min="0" value="0">
  </div>

</div>

<script>
const audio = document.getElementById("audio");
const seek = document.getElementById("seek");
const volume = document.getElementById("volume");
const time = document.getElementById("time");
const playBtn = document.getElementById("playBtn");

function togglePlay() {
  if (audio.paused) {
    audio.play();
    playBtn.textContent = "⏸";
  } else {
    audio.pause();
    playBtn.textContent = "▶";
  }
}

function restart() {
  audio.currentTime = 0;
  audio.play();
  playBtn.textContent = "⏸";
}

/* smooth time + seek */
audio.addEventListener("loadedmetadata", () => {
  seek.max = audio.duration;
  playBtn.textContent = audio.paused ? "▶" : "⏸";
});

audio.addEventListener("timeupdate", () => {
  seek.value = audio.currentTime;
  updateTime();
});

function updateTime() {
  const cur = fmt(audio.currentTime);
  const dur = fmt(audio.duration);
  time.textContent = `${cur} / ${dur}`;
}

seek.addEventListener("input", () => {
  audio.currentTime = seek.value;
});

/* volume */
volume.addEventListener("input", () => {
  audio.volume = volume.value;
});

function fmt(s) {
  if (!isFinite(s)) return "0:00";
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60).toString().padStart(2,"0");
  return `${m}:${sec}`;
}
</script>

</body>
</html>
